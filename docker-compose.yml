services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinyllab
      POSTGRES_USER: vinyllab
      POSTGRES_PASSWORD: vinyllab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinyllab -d vinyllab"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vinyllab
      DB_USER: vinyllab
      DB_PASSWORD: vinyllab
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
