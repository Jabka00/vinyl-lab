<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Жанри')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap">
  <div th:replace="~{fragments/layout :: alerts}"></div>
  <div class="page-head">
    <h1>Жанри</h1>
    <a class="button" th:href="@{/admin/genres/new}">Новий жанр</a>
  </div>
  <table class="sheet">
    <thead>
    <tr><th>Назва</th><th>Альбомів</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="genre : ${genres}">
      <td th:text="${genre.name}">Рок</td>
      <td th:text="${genre.albumCount}">0</td>
      <td class="row">
        <a th:href="@{/admin/genres/{id}/edit(id=${genre.id})}">Змінити</a>
        <form th:action="@{/admin/genres/{id}/delete(id=${genre.id})}" method="post" onsubmit="return confirm('Видалити жанр?');">
          <button class="text-button danger-text" type="submit" th:disabled="${genre.albumCount > 0}">Видалити</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
